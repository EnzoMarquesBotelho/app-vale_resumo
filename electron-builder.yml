# Configuração do electron-builder para gerar o executável distribuível do app.
# Usada por `npm run package`. Gera um instalador Windows (NSIS) em `release/`.
appId: com.appestudos.ialocal
productName: App de Estudos com IA Local

# Diretórios de saída e de recursos de build (ícones etc.).
directories:
  output: release
  buildResources: resources

# Arquivos empacotados dentro do app. O electron-vite gera tudo em `out/`.
files:
  - out/**/*
  - package.json

# Alvo Windows: instalador NSIS (um .exe distribuível que o usuário executa
# para instalar o app). Arquitetura x64.
win:
  target:
    - target: nsis
      arch:
        - x64

# Opções do instalador: permite escolher o diretório, cria atalhos no menu
# iniciar e na área de trabalho. Instalação por usuário (não exige admin).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: App de Estudos

# Evita tentar baixar/assinar binários online durante o empacotamento local.
# O app é 100% offline; não há assinatura de código configurada.
npmRebuild: false

# Destino de publicação dos artefatos (GitHub Releases).
#
# ATENÇÃO: no CI o electron-builder é chamado com `--publish never`, então ele
# NÃO envia nada ao GitHub — quem cria a Release e anexa os assets é o próprio
# workflow (softprops/action-gh-release). Este bloco permanece por dois motivos:
#   1. faz o builder gerar o manifesto `latest.yml` em `release/`;
#   2. o electron-updater lê owner/repo/provider daqui em tempo de execução
#      para localizar atualizações (necessário para o futuro updater in-app).
# NÃO remova este bloco.
publish:
  - provider: github
    owner: EnzoMarquesBotelho
    repo: app-vale_resumo
    # Metadado usado pelo electron-updater. A criação/publicação da Release é
    # feita pelo workflow do GitHub Actions, não pelo electron-builder.
    releaseType: release
